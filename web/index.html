<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151a">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Доход курьера</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main id="app">
    <div class="splash" aria-label="Доход курьера">
      <svg class="splash-mark" viewBox="0 0 100 100" aria-hidden="true">
        <defs><linearGradient id="shiftBrand" gradientUnits="userSpaceOnUse" x1="12" y1="86" x2="85" y2="18">
          <stop offset="0" stop-color="#ff7952"/>
          <stop offset=".38" stop-color="#ffbd57"/>
          <stop offset=".76" stop-color="#f4f1e9"/>
          <stop offset="1" stop-color="#ff7952"/>
        </linearGradient></defs>
        <g transform="translate(0 3)">
          <path fill="url(#shiftBrand)" d="M17 42H28C40 42 42 31 42 17H54V28C54 45 45 54 28 54H17Z"/>
          <path fill="url(#shiftBrand)" d="M17 42H28C40 42 42 31 42 17H54V28C54 45 45 54 28 54H17Z" transform="rotate(90 50 50)"/>
          <path fill="url(#shiftBrand)" d="M17 42H28C40 42 42 31 42 17H54V28C54 45 45 54 28 54H17Z" transform="rotate(180 50 50)"/>
          <path fill="url(#shiftBrand)" d="M17 42H28C40 42 42 31 42 17H54V28C54 45 45 54 28 54H17Z" transform="rotate(270 50 50)"/>
        </g>
      </svg>
    </div>
  </main>
  <nav id="bottomNav" class="bottom-nav" aria-label="Основная навигация" hidden></nav>
  <div id="toast" role="status" class="toast" hidden></div>
  <dialog id="exportDialog" aria-labelledby="exportTitle">
    <div id="exportPeriodLabel" class="export-dialog-eyebrow"></div>
    <h2 id="exportTitle">Экспорт для ChatGPT</h2>
    <button id="shareReport" class="button primary" type="button">Поделиться отчётом</button>
    <button id="saveReport" class="button outline" type="button">Сохранить отчёт</button>
    <div class="export-dialog-backup">
      <button id="backupReport" class="button export-backup-button" type="button" aria-label="Резервная копия JSON"><span><strong>Резервная копия JSON</strong><small>Все записи для восстановления</small></span></button>
    </div>
    <button id="closeExport" class="button quiet" type="button">Закрыть</button>
  </dialog>
  <dialog id="importDialog" aria-labelledby="importTitle">
    <h2 id="importTitle">Импорт данных</h2>
    <p id="importDescription" class="sr-only"></p>
    <div class="import-stats" aria-hidden="true"><div><strong id="importEntriesCount">—</strong><small>ЗАПИСЕЙ</small></div><div><strong id="importDaysCount">—</strong><small>ДНЕЙ</small></div><div><strong id="importClosuresCount">—</strong><small>ЗАКРЫТЫХ<br>ПЕРИОДОВ</small></div></div>
    <p class="import-merge">Совпадающие записи заменятся. Остальные слоты сохранятся.</p>
    <div class="import-cycle"><strong>НАЧАЛО 12 НЕДЕЛЬ</strong><span>Если дата в файле отличается, выберите нужную дату во вкладке «Период».</span></div>
    <div id="importError" class="error" role="alert" hidden></div>
    <button id="confirmImport" class="button primary" type="button">Импортировать</button>
    <button id="cancelImport" class="button outline" type="button">Отмена</button>
  </dialog>
</body>
</html>
