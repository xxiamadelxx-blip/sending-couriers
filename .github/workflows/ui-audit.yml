name: UI audit
on:
  pull_request:
    branches: [main, qa/native-forecast-cold-start]
  workflow_dispatch:
    inputs:
      focus:
        description: Android checks to run
        type: choice
        default: full
        options: [full, delta, content]
permissions:
  contents: read
concurrency:
  group: courier-ui-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Initialize pinned quality tools
        run: sh tools/quality/bootstrap.sh
      - name: Generate first-party source complexity report
        run: |
          set -euo pipefail
          test -x tools/quality/crapper/crapper
          test -x tools/quality/dryer/dryer
          test -x tools/quality/mutator/mutator
          mapfile -d '' sources < <(find web -type f \( -name '*.mjs' -o -name '*.js' \) ! -name 'forecast-worker-bundle.*' -print0 | sort -z)
          tools/quality/crapper/crapper --no-coverage "${sources[@]}" android/src/ru/courier/finance qa build.py preview.mjs | tee "$RUNNER_TEMP/crapper-report.txt"
          test -s .metrics/crap.edn
      - name: Detect duplicate Java forms
        run: |
          set -euo pipefail
          tools/quality/dryer/dryer android/src/ru/courier/finance | tee "$RUNNER_TEMP/dryer-report.txt"
          test -s .metrics/dry.edn
      - name: Scan mutation sites in financial and import code
        run: |
          set -euo pipefail
          tools/quality/mutator/mutator --scan web/core.mjs web/forecast.mjs android/src/ru/courier/finance/NativeCountModel.java | tee "$RUNNER_TEMP/mutator-scan.txt"
      - name: Mutation-test critical financial projections
        continue-on-error: true
        run: |
          set -euo pipefail
          tools/quality/mutator/mutator --coverage-command "rm -rf coverage && npx --yes c8@10.1.3 --reporter=lcov --include=web/core.mjs node --test tests/forecast-finance-mutation.test.mjs" --test-command "node --test tests/forecast-finance-mutation.test.mjs" --max-workers 3 web/core.mjs | tee "$RUNNER_TEMP/core-mutation-report.txt"
      - name: Enforce financial projection mutation threshold
        run: |
          python3 tools/quality/check_mutation_targets.py "$RUNNER_TEMP/core-mutation-report.txt"
      - name: Publish quality-tool reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courier-complexity-${{ github.sha }}
          path: |
            .metrics/crap.edn
            .metrics/dry.edn
            .metrics/mutate
            ${{ runner.temp }}/crapper-report.txt
            ${{ runner.temp }}/core-mutation-report.txt
            ${{ runner.temp }}/dryer-report.txt
            ${{ runner.temp }}/mutator-scan.txt
          if-no-files-found: warn
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Model and finance regressions
        run: npm test
      - name: Emulator recovery unit tests
        run: python3 -m unittest discover -s tests -p 'test_emulator_wait_home.py' -v
      - name: Empty-state 360/390 native XML contract unit tests
        run: python3 -m unittest discover -s tests -p 'test_empty_state_contract.py' -v
      - name: Empty-state native backup contract unit tests
        run: python3 -m unittest discover -s tests -p 'test_empty_backup_contract.py' -v
      - name: Large-form geometry independent unit tests
        run: python3 -m unittest discover -s tests -p 'test_form_large_geometry.py' -v
      - name: Accessible Android node XML unit tests
        run: python3 -m unittest discover -s tests -p 'test_a11y_xml_smoke.py' -v
      - name: Full native accessibility layout contract unit tests
        run: python3 -m unittest discover -s tests -p 'test_a11y_layout_matrix.py' -v
      - name: Independent-gate orchestration unit tests
        run: python3 -m unittest discover -s tests -p 'test_ui_gate_orchestrator.py' -v
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android command line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download pinned offline Russian and English OCR models
        run: |
          set -euo pipefail
          mkdir -p m4-models/tessdata
          base='https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd'
          curl -fL "$base/rus.traineddata" -o m4-models/tessdata/rus.traineddata
          curl -fL "$base/eng.traineddata" -o m4-models/tessdata/eng.traineddata
          test "$(git hash-object m4-models/tessdata/rus.traineddata)" = b146cb2263acbc6383f8e92ea0ce759537687bb8
          test "$(git hash-object m4-models/tessdata/eng.traineddata)" = bbef4675053b5b468cdb477053e28b1c698ba08e
          test "$(wc -c < m4-models/tessdata/rus.traineddata)" -eq 3861738
          test "$(wc -c < m4-models/tessdata/eng.traineddata)" -eq 4113088
      - name: Build isolated test APK, preserve release signing
        id: build-ui-apk
        run: |
          cp -a . "$RUNNER_TEMP/courier-ui-source"
          python3 "$RUNNER_TEMP/courier-ui-source/build.py" --sdk "$ANDROID_HOME" --test-signing --output "$RUNNER_TEMP/courier-ui-test-only.apk"
          python3 "$RUNNER_TEMP/courier-ui-source/tests/verify_native.py" --sdk "$ANDROID_HOME"
          python3 - <<'PY'
          import os, pathlib, zipfile
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'courier-ui-test-only.apk') as apk:
              for source in pathlib.Path('web').iterdir():
                  if source.is_file():
                      assert apk.read('assets/www/'+source.name) == source.read_bytes(), source
          PY
      - name: Publish current-source test APK for review
        if: always() && steps.build-ui-apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: courier-ui-test-only-${{ github.sha }}
          path: ${{ runner.temp }}/courier-ui-test-only.apk
          if-no-files-found: error
      - name: Build isolated transfer package for owner signing
        run: |
          cp -a . "$RUNNER_TEMP/courier-transfer-source"
          python3 "$RUNNER_TEMP/courier-transfer-source/build.py" --sdk "$ANDROID_HOME" --variant transferRelease --test-signing --output "$RUNNER_TEMP/courier-transfer-test-only.apk"
          cp "$RUNNER_TEMP/courier-transfer-source/build/aligned.apk" "$RUNNER_TEMP/courier-transfer-unsigned.apk"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/apksigner.jar"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/courier-transfer-test-only.apk" | grep "package: name='ru.courier.finance.transfer' versionCode='50' versionName='1.7.36'"
      - name: Preserve fresh unsigned transfer APK for owner signing
        uses: actions/upload-artifact@v4
        with:
          name: courier-transfer-unsigned-ready-${{ github.sha }}
          path: |
            ${{ runner.temp }}/courier-transfer-unsigned.apk
            ${{ runner.temp }}/apksigner.jar
          if-no-files-found: error
      - name: Build 1.7.35 transfer baseline with the same temporary test signer
        run: |
          mkdir -p "$RUNNER_TEMP/courier-transfer-prior"
          git fetch --no-tags --depth=1 origin dba5c94e9cca55509b0cffda476398d68fd420f4
          git archive dba5c94e9cca55509b0cffda476398d68fd420f4 | tar -x -C "$RUNNER_TEMP/courier-transfer-prior"
          cp "$RUNNER_TEMP/courier-transfer-source/build.py" "$RUNNER_TEMP/courier-transfer-prior/build.py"
          mkdir -p "$RUNNER_TEMP/courier-transfer-prior/m4-models/tessdata"
          cp m4-models/tessdata/rus.traineddata "$RUNNER_TEMP/courier-transfer-prior/m4-models/tessdata/"
          cp m4-models/tessdata/eng.traineddata "$RUNNER_TEMP/courier-transfer-prior/m4-models/tessdata/"
          mkdir -p "$RUNNER_TEMP/courier-transfer-prior/signing/qa"
          cp "$RUNNER_TEMP/courier-transfer-source/signing/qa/transfer-test.jks" "$RUNNER_TEMP/courier-transfer-prior/signing/qa/"
          cp "$RUNNER_TEMP/courier-transfer-source/signing/qa/password.txt" "$RUNNER_TEMP/courier-transfer-prior/signing/qa/"
          python3 "$RUNNER_TEMP/courier-transfer-prior/build.py" --sdk "$ANDROID_HOME" --variant transferRelease --test-signing --output "$RUNNER_TEMP/courier-transfer-prior-test-only.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/courier-transfer-prior-test-only.apk" | grep "package: name='ru.courier.finance.transfer' versionCode='49' versionName='1.7.35'"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native UI checks on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            python3 qa/run_ui_gates.py --apk "$RUNNER_TEMP/courier-ui-test-only.apk" --old "$RUNNER_TEMP/courier-transfer-prior-test-only.apk" --new "$RUNNER_TEMP/courier-transfer-test-only.apk" --focus "${{ inputs.focus || 'full' }}"
      - name: Capture audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ github.sha }}
          path: qa-results/
          if-no-files-found: error
      - name: Deliver unsigned transfer build for persistent signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: courier-transfer-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/courier-transfer-unsigned.apk
            ${{ runner.temp }}/apksigner.jar
          if-no-files-found: error
