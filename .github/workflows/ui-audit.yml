name: UI audit before and after
on:
  pull_request:
    branches: [main, qa/native-forecast-cold-start]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courier-ui-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Model and finance regressions
        run: npm test
      - name: Set up Android command line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build isolated test APK, preserve release signing
        run: |
          cp -a . "$RUNNER_TEMP/courier-ui-source"
          python3 "$RUNNER_TEMP/courier-ui-source/build.py" --sdk "$ANDROID_HOME" --output "$RUNNER_TEMP/courier-ui-test-only.apk"
          python3 "$RUNNER_TEMP/courier-ui-source/tests/verify_native.py" --sdk "$ANDROID_HOME"
          python3 - <<'PY'
          import os, pathlib, zipfile
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'courier-ui-test-only.apk') as apk:
              for source in pathlib.Path('web').iterdir():
                  if source.is_file():
                      assert apk.read('assets/www/'+source.name) == source.read_bytes(), source
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native UI comparison on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          script: python3 qa/run_ui_audit.py
      - name: Capture audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ github.sha }}
          path: qa-results/
          if-no-files-found: error
