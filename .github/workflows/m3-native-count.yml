name: M3 native offline count engine
on:
  push:
    branches: [m3/native-autonomous-count-20261029]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: courier-m3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: M2 SQLite + M3 migration contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_m2_*.py' -v
          python3 -m unittest discover -s tests -p 'test_m3_*.py' -v
      - name: Existing count, finance, and import regression suite
        run: npm test
      - name: Pure Java native model tests
        run: |
          mkdir -p "$RUNNER_TEMP/m3-classes"
          javac --release 8 -encoding UTF-8 -d "$RUNNER_TEMP/m3-classes" \
            android/src/ru/courier/finance/NativeCountModel.java tests/NativeCountModelTest.java
          java -cp "$RUNNER_TEMP/m3-classes" ru.courier.finance.NativeCountModelTest
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile isolated M3 headless Android probe APK
        run: |
          cp -a . "$RUNNER_TEMP/m3-probe"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"m3-probe"
          manifest=root/"android/AndroidManifest.xml"
          source=root/"android/src/ru/courier/finance"
          text=manifest.read_text()
          original="ru.courier.finance"
          target="ru.courier.finance.m3probe"
          assert text.count('package="'+original+'"')==1
          assert "M3DeviceProbeActivity" not in text
          text=text.replace(original,target)
          activity='''<activity android:name=".M3DeviceProbeActivity" android:exported="true">
              <intent-filter>
                <action android:name="android.intent.action.VIEW"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <category android:name="android.intent.category.BROWSABLE"/>
                <data android:scheme="courierm3" android:host="probe"/>
              </intent-filter>
            </activity>'''
          assert "<provider" in text
          manifest.write_text(text.replace("<provider",activity+"<provider"))
          probe=(root/"tests/M3DeviceProbeActivity.java").read_text()
          assert probe.startswith("package "+original+";")
          (source/"M3DeviceProbeActivity.java").write_text(probe)
          for java in source.rglob("*.java"):
              body=java.read_text()
              if body.startswith("package "+original+";"):
                  java.write_text(body.replace("package "+original+";","package "+target+";",1))
          PY
          python3 "$RUNNER_TEMP/m3-probe/build.py" --sdk "$ANDROID_HOME" --output "$RUNNER_TEMP/m3-limrun-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/m3-limrun-debug.apk" | grep "package: name='ru.courier.finance.m3probe'"
          sha256sum "$RUNNER_TEMP/m3-limrun-debug.apk"
      - name: Publish exact-SHA test APK to isolated QA branch
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git checkout -B ci/m3-limrun-probe-temp "$GITHUB_SHA"
          mkdir -p qa
          cp "$RUNNER_TEMP/m3-limrun-debug.apk" qa/m3-limrun-debug.apk
          printf '%s\n' "$GITHUB_SHA" > qa/m3-limrun-source-sha.txt
          sha256sum qa/m3-limrun-debug.apk > qa/m3-limrun-apk-sha256.txt
          git add -f qa/m3-limrun-debug.apk qa/m3-limrun-source-sha.txt qa/m3-limrun-apk-sha256.txt
          git commit -m "ci: M3 Limrun probe APK for $GITHUB_SHA"
          git push --force origin HEAD:ci/m3-limrun-probe-temp
